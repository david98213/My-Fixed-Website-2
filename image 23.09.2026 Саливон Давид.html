<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some pictures</title>
    <style>
        body {
            background-image: url("https://images.hitpaw.com/topics/gif-tips/duck-transparent-gif.gif");
            background-size: 100px;
            background-repeat: no-repeat;
            background-position: 100% 100%;
            background-attachment: fixed;
        }

        p{
            font-size: 50px;
            color: aqua;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSwtBtL2ich5fEGWxA7RX8K56Vl16BtrzXK5zwQII722Q&s=10");
        }
        #d1{
            background-image: url("Me and my Dad and Mom.jpg");
            border: 50px groove rgb(255, 255, 255);
            width: 1280px;
            height: 800px;
        }
        #d2{
            background-image: url("Me and my Dad.jpg");
            border: 50px groove white;
            width: 800px;
            height: 1280px;
            background-size: cover;
        }
        #d3{
            border-style: solid;
            width: 900px;
            height: 900px;
            background-size: cover;
             border-image: linear-gradient(45deg, cyan darkblue) 30;
             border-width: 50px;
        }
        img{
            width: 700px;
            height: 700px;
            background-size: cover;
        }

        body{
            background-color: #f5ff38;
        }
        #d4{
            background-image: url("Me and my Dad 2.jpg");
            border: 50px groove white;
            width: 1280px;
            height: 960px;
            background-size: cover;
        }
    
    </style>
</head>
<body>
    <p>we're learning images</p>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
</body>
</html>
