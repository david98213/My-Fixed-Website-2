<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gradient</title>
    <style>
    div{
    width: 300px;
    height: 300px;
    margin: 20px;
    float: left;
}
    </style>
</head>
<body>
    <p style="font-size: 1in; background: linear-gradient(cyan, red); text-align: center;">were learning gradient</p>
    <div style=" width: 500px ;background: linear-gradient(red 50%, rgb(165, 153, 206) 50%); "></div>
    <div style="background: linear-gradient(red, rgb(0, 145, 255)); "></div>
    <div style="background: linear-gradient(50deg, red, rgb(165, 153, 206)); "></div>
    <div style="background: linear-gradient(50deg, red, rgb(165, 153, 206)); "></div>
    <div style="background: radial-gradient(red, rgb(165, 153, 206)); "></div>
    <div style="background: radial-gradient(circle at 25% 50%, red 50%, rgb(165, 153, 206) 50%); "></div>
    <div style="background: conic-gradient(red, rgb(165, 153, 206),  yellow, green, orange, blue, cyan);"></div>
    <div style="background: repeating-linear-gradient( red 10%, rgb(165, 153, 206) 20%); "></div>
    <div style="background: repeating-conic-gradient( red 5% 10%, rgb(165, 153, 206) 10% 15%); "></div>
    <div style="background: repeating-conic-gradient( red 10% 15%, rgb(165, 153, 206) 20% 25%, blue 25% 30%, green 30% 35%, cyan 40% 45%, white 50% 55% ); "></div>
    <div style="background: repeating-linear-gradient(red 10%, rgb(165, 153, 206) 20%, green 30%, blue 40%, pink 50%, lightgreen 60%, cyan 70%, orange 80%);"></div>
    <div style="background:
    repeating-linear-gradient( 190deg,
      rgba(0, 221, 255, 0.5) 40px,
      rgba(0, 0, 255, 0.5) 80px,
      rgb(0, 255, 200) 120px,
      rgb(0 255 0 / 50%) 160px,
      rgb(0 0 255 / 50%) 200px,
      rgb(75 0 130 / 50%) 240px,
      rgb(238 130 238 / 50%) 280px,
      rgb(255 0 0 / 50%) 300px
    ),
    repeating-linear-gradient(
      -190deg,
      rgb(255 0 0 / 50%) 30px,
      rgb(255 153 0 / 50%) 60px,
      rgb(0, 255, 217) 90px,
      rgba(0, 217, 255, 0.5) 120px,
      rgba(77, 255, 0, 0.5) 150px,
      rgb(75 0 130 / 50%) 180px,
      rgba(255, 0, 0, 0.5) 210px,
      rgba(230, 121, 121, 0.5) 230px
    ),
    repeating-linear-gradient(
      23deg,
      rgb(0, 106, 255) 50px,
      rgb(255, 215, 141) 100px,
      rgb(255, 255, 93) 150px,
      rgba(40, 255, 40, 0.509) 200px,
      rgb(40, 40, 197) 250px,
      indigo 300px,
      rgb(239, 60, 239) 350px,
      red 370px
    );"></div>

</body>
</html>
